<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Timeline Cards</title>
 <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #6687c9;
}

.page {
  padding: 30px;
}

/* Social Icons */
.socials {
  display: flex;
  gap: 10px;
  height: 35px;
  margin-bottom: 20px;
}

.socials span {
  width: 28px;
  height: 28px;
  color: white;
  border-radius: 5px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
}

.insta { background: #e1306c; }
.fb { background: #1877f2; }
.in { background: #0077b5; }

/* White Container */
.container {
  background: white;
  padding: 40px 40px;
}

/* Timeline */
.timeline {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 40px;
}

.dot {
  width: 40px;
  height: 40px;
  border-radius: 50%;
}

.grey {
  background: #6b6e8a;
}

.black {
  background: black;
}

.line {
  width: 180px;
  height: 2px;
  background: black;
}

/* Cards */
.info-card {
  background: #9dbbe4;
  padding: 30px;
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 50px;
}

.icon {
  font-size: 60px;
}

.info-card p {
  font-size: 20px;

  color: #222;
}

 </style>
</head>
<body>

<div class="page">

  <!-- Social Icons -->
  <div class="socials">
    <img src="images.jpg">
 <img src="download.jpg">
 <img src="fecebook.png">
  </div>

  <!-- White Box -->
  <div class="container">

    <!-- Timeline -->
    <div class="timeline">
      <div class="dot grey"></div>
      <div class="line"></div>
      <div class="dot black"></div>
      <div class="line"></div>
      <div class="dot grey"></div>
    </div>

    <!-- Card 1 -->
    <div class="info-card">
      <div class="icon">👜</div>
      <p>Strong, spacious, and stylish – a bag for every need.</p>
    </div>

    <!-- Card 2 -->
    <div class="info-card">
      <div class="icon">👜</div>
      <p>Strong, spacious, and stylish – a bag for every need.</p>
    </div>

  </div>

</div>

</body>
</html>
