<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form UI</title>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      background: #f4b62b;
    }

    /* Full page */
    .page {
      width: 100%;
      height: 100%;
      background: #fff;
      border: 18px solid #fbdfa1;
      padding: 20px;
    }

    /* Header */
    .header {
      background: #8de4ec;
      padding: 10px 15px;
    }

    .social-icons i {
      font-size: 26px;
      margin-right: 15px;
      cursor: pointer;
    }

    /* Center content */
    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 60px;
    }

    
    .user-icon::after {
      content: "";
      width: 160px;
      height: 60px;
      background: #000;
      border-radius: 80px 80px 0 0;
      position: absolute;
      bottom: -90px;
      left: 50%;
      transform: translateX(-50%);
    }

    /* Inputs */
    .input-box {
      width: 70%;
      max-width: 500px;
      height: 55px;
      background: #cfcfcf;
      border: 3px solid #000;
      margin-top: 25px;
    }

    .input-row {
      display: flex;
      gap: 20px;
      width: 70%;
      max-width: 500px;
      margin-top: 20px;
    }

    .input-row .small {
      flex: 1;
      height: 45px;
      background: #cfcfcf;
      border: 3px solid #000;
    }

    /* Submit button */
    .submit-btn {
      margin-top: 60px;
      padding: 8px 28px;
      background: #f7d7a7;
      border: none;
      border-radius: 20px;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 4px 4px red;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="page">

    <!-- Header -->
    <div class="header">
      <div class="social-icons">
        <i class="fab fa-instagram"></i>
        <i class="fab fa-facebook"></i>
        <i class="fab fa-linkedin"></i>
      </div>
    </div>

    <!-- Content -->
    <div class="content">

      <!-- User icon -->
      <div class="user-icon"><img src="man.jpg"></div>

      <!-- Inputs -->
      <div class="input-box"></div>

      <div class="input-row">
        <div class="small"></div>
        <div class="small"></div>
      </div>

      <div class="input-box"></div>

      <!-- Button -->
      <button class="submit-btn">Submit</button>

    </div>

  </div>

</body>
</html>
